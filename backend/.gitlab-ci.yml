cache:
  paths:
    - ${CI_PROJECT_DIR}/.m2/repository

variables:
   VERSION: 1.0.${CI_PIPELINE_ID}
   MAVEN_REPO_PATH: ${CI_PROJECT_DIR}/.m2/repository
   JAVA_OPTS: -XX:MaxRAMPercentage=90 # для того, чтобы Maven не съел всю свободную оперативку
   SONAR_BACK_OPTS: "-Dsonar.projectKey=dby_key_back -Dsonar.host.url=${SONARQUBE_URL} -Dsonar.login=${SONAR_PROJECT_KEY_BACK} -Dsonar.qualitygate.wait=true"

stages:
   - build
   - test
   - release
   - deploy
   - notify

build:
   stage: build
   script:
      - cd backend
      - >
         mvn package
         -Dversion.application=${VERSION}
         -Dmaven.repo.local=${MAVEN_REPO_PATH}
   rules: # rules и only в данных случаях взаимозаменяемы
      - changes:
         - backend/**/*

sonarqube-backend-sast:
  stage: test
  image: maven:3.8-openjdk-16
  script:
    - cd backend
    - mvn verify sonar:sonar $SONAR_BACK_OPTS
  allow_failure: false

release:
   stage: release
   script:
      - cd backend
      - >
         mvn deploy -DskipTests -s settings.xml
         -Dversion.application=${VERSION}
         -Dmaven.repo.local=${MAVEN_REPO_PATH}
   rules:
      - changes:
         - backend/**/*

deploy:
   stage: deploy
   before_script:
      #устанавливаем ssh-agent для удобства аутентификации по ssh
      - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
      - eval $(ssh-agent -s)
      #сохраняем сгенеренный ранее приватный ключ для раннера
      - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
      - mkdir -p ~/.ssh
      - chmod 600 ~/.ssh
      - ssh-keyscan ${DEV_HOST} >> ~/.ssh/known_hosts
      # Копируем файл сервиса на сервер
   script:
      #выполняем простую команду для проверки
      - scp ./backend/sausage-store-backend.service ${DEV_USER}@${DEV_HOST}:/home/${DEV_USER}/sausage-store-backend.service
      - ssh ${DEV_USER}@${DEV_HOST} "export CURRENT_VERSION=${VERSION}; export VERSION=${VERSION}; export DEV_HOST=${DEV_HOST}; export NEXUS_REPO_URL=${NEXUS_REPO_URL}; export NEXUS_REPO_BACKEND_NAME=${NEXUS_REPO_BACKEND_NAME}; export NEXUS_REPO_USER=${NEXUS_REPO_USER}; export NEXUS_REPO_PASS=${NEXUS_REPO_PASS};setsid /bin/bash -s " < ./backend/deploy.sh
   environment:
      name: staging
      url: http://std-ext-019-01.praktikum-services.tech/

telegram-notification-backend:
  stage: notify
  rules:
    - changes:
      - backend/**/*
    - if: '$CI_COMMIT_MESSAGE =~ /send notification/i'
      when: always
    - when: never
  script:
    - |
      curl -s -X POST -H "Content-Type: application/json" \
      -d '{"chat_id": "-1002426676593", "text": "✅ Быковский Д.В. Backend успешно собран! Ссылка на артефакт: '$CI_PROJECT_URL'/-/jobs/artifacts/'$CI_COMMIT_SHA'/download?job=build-backend-code-job"}' \
      "https://api.telegram.org/bot5933756043:AAE8JLL5KIzgrNBeTP5e-1bkbJy4YRoeGjs/sendMessage"