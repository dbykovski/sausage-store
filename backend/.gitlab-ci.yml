cache:
  paths:
    - ${CI_PROJECT_DIR}/.m2/repository

variables:
  VERSION: 1.0.${CI_PIPELINE_ID}
  MAVEN_REPO_PATH: ${CI_PROJECT_DIR}/.m2/repository
  JAVA_OPTS: -XX:MaxRAMPercentage=90
  DEPLOY_COLOR: "blue"

stages:
  - build
  - release
  - deploy

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  # переменные CI_REGISTRY_USER, CI_REGISTRY_PASSWORD, CI_REGISTRY генерятся Гитлабом, их задавать не надо
  script:
    - echo "Building Docker image for backend (version:${VERSION})"
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/backend"
      --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/sausage-backend:$CI_COMMIT_SHA"
      --build-arg VERSION=$VERSION
      --cache=true

release:
  variables:
    GIT_STRATEGY: none
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [ "" ]
  cache: [ ]
  stage: release
  before_script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - crane tag $CI_REGISTRY_IMAGE/sausage-backend:$CI_COMMIT_SHA $VERSION

deploy-backend:
  stage: deploy
  image: alpine:3.18
  before_script:
    - apk add openssh-client bash gettext docker-cli
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan ${DEV_HOST} >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - envsubst < ./backend/docker-compose-backend.yml > docker-compose-temp.yml
    - envsubst '${VERSION} ${DEPLOY_COLOR} ${CI_REGISTRY_USER} ${CI_REGISTRY_PASSWORD}' < ./backend/deploy-backend.sh > deploy-backend-temp.sh
    - ssh ${DEV_USER}@${DEV_HOST} "mkdir -p ~/bin"
    - scp docker-compose-temp.yml ${DEV_USER}@${DEV_HOST}:~/docker-compose-backend.yml
    - scp ./backend/opposite-color.sh ${DEV_USER}@${DEV_HOST}:~/bin/
    - scp deploy-backend-temp.sh ${DEV_USER}@${DEV_HOST}:~/deploy-backend.sh
    - ssh ${DEV_USER}@${DEV_HOST} "chmod +x ~/bin/opposite-color.sh ~/deploy-backend.sh && ~/deploy-backend.sh"
  after_script:
    - rm -f docker-compose-temp.yml deploy-backend-temp.sh

